<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="contactIllustrTitle">
  <title id="contactIllustrTitle">Active listening and emotional support</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBEDE2"/>
      <stop offset="55%" stop-color="#BFD7EA" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#F0C4AC" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="28" fill="url(#sky)"/>
  <circle cx="520" cy="78" r="46" fill="#B9DACD" fill-opacity=".55"/>
  <circle cx="96" cy="320" r="38" fill="#DCCFED" fill-opacity=".45"/>
  <circle cx="560" cy="310" r="22" fill="#F6C7B6" fill-opacity=".5"/>

  <!-- Soft ground -->
  <ellipse cx="320" cy="330" rx="210" ry="28" fill="#B9DACD" fill-opacity=".35"/>

  <!-- Listener figure -->
  <g transform="translate(170 95)">
    <ellipse cx="70" cy="195" rx="58" ry="14" fill="#222" fill-opacity=".06"/>
    <path d="M35 90c8-42 62-42 70 0v70c0 18-16 32-35 32s-35-14-35-32V90z" fill="#B9DACD"/>
    <circle cx="70" cy="58" r="32" fill="#F1F0F5"/>
    <circle cx="70" cy="58" r="32" fill="#E8E4F0" fill-opacity=".5"/>
    <path d="M48 52c4-8 14-8 18 0" stroke="#222" stroke-opacity=".25" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M74 52c4-8 14-8 18 0" stroke="#222" stroke-opacity=".25" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M58 72c6 8 18 8 24 0" stroke="#222" stroke-opacity=".2" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Student figure -->
  <g transform="translate(340 110)">
    <ellipse cx="70" cy="180" rx="52" ry="12" fill="#222" fill-opacity=".06"/>
    <path d="M38 85c6-38 58-38 64 0v62c0 16-14 28-32 28s-32-12-32-28V85z" fill="#BFD7EA"/>
    <circle cx="70" cy="55" r="30" fill="#F1F0F5"/>
    <path d="M50 50c3-7 12-7 15 0" stroke="#222" stroke-opacity=".25" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M75 50c3-7 12-7 15 0" stroke="#222" stroke-opacity=".25" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M58 68c5 6 15 6 20 0" stroke="#222" stroke-opacity=".2" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Heart / care symbol between them -->
  <g transform="translate(300 155)">
    <path d="M20 8c0-6 5-10 10-10 4 0 7 2 10 6 3-4 6-6 10-6 5 0 10 4 10 10 0 12-20 24-20 24S20 20 20 8z" fill="#F0C4AC" fill-opacity=".9"/>
  </g>

  <!-- Speech / listening waves -->
  <path d="M250 150c18-10 34-10 52 0" fill="none" stroke="#222" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"/>
  <path d="M258 168c12-7 24-7 36 0" fill="none" stroke="#222" stroke-opacity=".1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Soft leaf accents -->
  <path d="M118 210c18-28 42-20 48 6-22 6-36 18-48-6z" fill="#B9DACD" fill-opacity=".7"/>
  <path d="M500 220c-16-26-40-18-46 6 20 6 34 16 46-6z" fill="#DBEDE2" fill-opacity=".85"/>
</svg>
