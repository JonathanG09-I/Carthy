{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong — Carthy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen bg-[#F5F5F5] text-[#1C1C1E] flex items-center justify-center px-4">
    <main class="max-w-md w-full text-center bg-white rounded-3xl border border-gray-100 shadow-sm p-8 sm:p-10">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-gray-400 mb-3">500</p>
        <h1 class="serif text-3xl font-bold mb-3">Something went wrong</h1>
        <p class="text-sm text-gray-500 mb-8 leading-relaxed">
            We hit an unexpected error. Please try again in a moment.
            If the problem continues, return to the home page.
        </p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-[#1C1C1E] text-white text-sm font-bold hover:opacity-90">Back to Home</a>
            <a href="/app/" class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-[#B9DACD]/40 text-[#1C1C1E] text-sm font-bold hover:bg-[#B9DACD]/60">Open App</a>
        </div>
    </main>
</body>
</html>
